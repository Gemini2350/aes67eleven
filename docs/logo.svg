    <rect x="70" y="16" width="16" height="68" rx="6" fill="url(#bar)"/>
    <!-- led gaps -->
    <g fill="#0d121b" opacity="0.9">
      <rect x="40" y="44" width="20" height="4"/>
      <rect x="40" y="58" width="20" height="4"/>
      <rect x="40" y="72" width="20" height="4"/>
      <rect x="68" y="32" width="20" height="4"/>
      <rect x="68" y="44" width="20" height="4"/>
      <rect x="68" y="58" width="20" height="4"/>
      <rect x="68" y="72" width="20" height="4"/>
    </g>
  </g>
</svg>
