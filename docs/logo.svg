<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2534"/>
      <stop offset="1" stop-color="#0d121b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1d9e56"/>
      <stop offset="0.72" stop-color="#2ecc71"/>
      <stop offset="0.78" stop-color="#f1c40f"/>
      <stop offset="1" stop-color="#f1c40f"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <path d="M 18 96 C 28 84, 36 84, 46 96 S 64 108, 74 96 S 92 84, 110 96"
